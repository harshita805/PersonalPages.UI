<div class="profile-wrapper">

  <div class="profile-card">

    <div class="profile-header">
      <h2>Edit Profile</h2>
      <p>Update your personal information</p>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="save()">

      <mat-form-field class="full" appearance="outline">
        <mat-label>Full Name</mat-label>
        <input matInput formControlName="fullName">
      </mat-form-field>

      <mat-form-field class="full" appearance="outline">
        <mat-label>Gender</mat-label>
        <mat-select formControlName="gender">
          <mat-option value="Male">Male</mat-option>
          <mat-option value="Female">Female</mat-option>
          <mat-option value="Other">Other</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="full" appearance="outline">
        <mat-label>Date of Birth</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="dateOfBirth">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <div class="preferences-section">

        <h3>Display Preferences</h3>

        <!-- Dark Mode Toggle -->
        <div class="preference-item">
          <label>
            <input type="checkbox" [checked]="currentTheme === 'dark'" (change)="toggleTheme($event)">
            Dark Mode
          </label>
        </div>

        <!-- Font Size Control -->
        <div class="preference-item">
          <label>Font Size:</label>
          <input type="range" min="14" max="22" step="1" [value]="currentFontSize" (input)="changeFontSize($event)">
        </div>

        <!-- Font Family -->
        <div class="preference-item">
          <label>Font Family:</label>

          <select [value]="currentFontFamily" (change)="changeFontFamily($event)">
            <option value="'Arial', sans-serif">Arial</option>
            <option value="'Segoe UI', sans-serif">Segoe UI</option>
            <option value="'Georgia', serif">Georgia</option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="'Poppins', sans-serif">Poppins</option>
          </select>
        </div>

      </div>

      <button mat-raised-button color="primary" class="save-btn">
        Save Changes
      </button>

    </form>

  </div>

</div>
