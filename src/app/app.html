<mat-toolbar color="primary">
    <span class="cursor-pointer" (click)="goToDashboard()">Personal Pages</span>

    <span class="spacer"></span>

    <!-- Show only when logged in -->
    @if(auth.isLoggedIn()){
    <ng-container>
        <!-- ✅ Write Entry button -->
        <button mat-icon-button class="icon-btn" routerLink="/journal/create" matTooltip="Write Entry">
            <mat-icon>edit</mat-icon>
        </button>

        <!-- ⋮ Three-dot menu icon -->
        <button mat-icon-button [matMenuTriggerFor]="accountMenu" matTooltip="Account options">
            <mat-icon>more_vert</mat-icon>
        </button>

        <mat-menu #accountMenu="matMenu">
            <button mat-menu-item (click)="goToProfile()">
                Edit Profile
            </button>
            <button mat-menu-item (click)="goToMyJournals()">
                My Journals
            </button>
            <button mat-menu-item (click)="logout()">
                Logout
            </button>
        </mat-menu>

    </ng-container>
    }
</mat-toolbar>

<!-- Global Loader -->
<app-loader></app-loader>

<!-- Routed Pages -->
<router-outlet></router-outlet>
