<mat-toolbar class="main-toolbar">

  <!-- Logo / Title -->
  <div class="logo-section" (click)="goToDashboard()">
    <mat-icon class="logo-icon">auto_stories</mat-icon>
    <span class="app-title">Personal Pages</span>
  </div>

  <span class="spacer"></span>

  @if(auth.isLoggedIn()){
  <div class="toolbar-actions">

    <!-- Write Entry -->
    <button 
      mat-icon-button 
      class="icon-btn primary-action"
      (click)="goToCreateJournal()" 
      matTooltip="Write Journal">

      <mat-icon>edit</mat-icon>
    </button>

    <!-- Account Menu -->
    <button 
      mat-icon-button 
      [matMenuTriggerFor]="accountMenu" 
      matTooltip="Account">

      <mat-icon>account_circle</mat-icon>
    </button>

    <mat-menu #accountMenu="matMenu" class="account-menu">

      <button mat-menu-item (click)="goToProfile()">
        <mat-icon>person</mat-icon>
        <span>Edit Profile</span>
      </button>

      <button mat-menu-item (click)="goToMyJournals()">
        <mat-icon>menu_book</mat-icon>
        <span>My Journals</span>
      </button>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="logout()">
        <mat-icon color="warn">logout</mat-icon>
        <span>Logout</span>
      </button>

    </mat-menu>

  </div>
  }

</mat-toolbar>

<!-- Global Loader -->
<app-loader></app-loader>

<!-- Routed Pages -->
<div class="page-content">
  <router-outlet></router-outlet>
</div>

<app-back-button></app-back-button>

<app-toast></app-toast>
