<mat-toolbar color="primary">
    <span (click)="goToDashboard()" role="button">Personal Pages</span>

    <span class="spacer"></span>

    <!-- Show menu only if logged in -->
    @if(auth.isLoggedIn()){
    <ng-container>

        <button mat-button [matMenuTriggerFor]="accountMenu">
            Account
        </button>

        <mat-menu #accountMenu="matMenu">
            <button mat-menu-item (click)="goToProfile()">
                Edit Profile
            </button>
            <button mat-menu-item (click)="goToMyJournals()">
                My Journals
            </button>
            <button mat-menu-item (click)="logout()">
                Logout
            </button>
        </mat-menu>

    </ng-container>
    }
</mat-toolbar>
<app-loader></app-loader>
<router-outlet></router-outlet>
