<mat-card>
  <h2>Mood Tracker</h2>

  <mat-form-field>
    <mat-label>Select Mood</mat-label>
    <mat-select>
      <mat-option value="happy">Happy</mat-option>
      <mat-option value="sad">Sad</mat-option>
      <mat-option value="neutral">Neutral</mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-raised-button color="accent">
    Save Mood
  </button>

  <p>AI Prompt: "Write about something that made you smile today."</p>
</mat-card>
