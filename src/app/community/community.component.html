@for(post of posts;track post){
<div class="post-card">

  <div class="post-header">
    <h3>{{ post.title }}</h3>

    <div class="post-meta">
      🧑 {{ post.authorName }}
      &nbsp; | &nbsp;
      📅 {{ post.createdAt | date:'medium' }}
    </div>
  </div>

  <p class="post-preview">
    {{ post.content | slice:0:200 }}...
  </p>

  <div class="engagement-bar">
    <button (click)="likePost(post)">
      ❤️ {{ post.likeCount }}
    </button>

    <span>
      👁 {{ post.viewCount }}
    </span>

    <span>
      💬 {{ commentsMap[post.id]?.length || 0 }}
    </span>
  </div>

</div>
}
