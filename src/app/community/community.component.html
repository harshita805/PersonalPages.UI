<div class="page-container">
  <mat-card class="form-card">
    <h2>My Journals</h2>

    @if (journals.length === 0) {
    <p>No journal entries found.</p>
    } @else {

    @for (journal of journals;track journal) {
    <mat-card>
      <h3>{{ journal.title }}</h3>
      <p>{{ journal.content }}</p>
      <p><strong>By:</strong> {{ journal.fullName }}</p>
      <small>{{ journal.createdAt | date }}</small>
    </mat-card>
    }

    }
  </mat-card>
</div>
