<mat-card>
  <h2>New Journal Entry</h2>

  <mat-form-field class="full">
    <mat-label>Title</mat-label>
    <input matInput>
  </mat-form-field>

  <mat-form-field class="full">
    <mat-label>Content</mat-label>
    <textarea matInput rows="6"></textarea>
  </mat-form-field>

  <mat-form-field class="full">
    <mat-label>Mood</mat-label>
    <mat-select>
      <mat-option value="happy">Happy</mat-option>
      <mat-option value="sad">Sad</mat-option>
      <mat-option value="neutral">Neutral</mat-option>
      <mat-option value="excited">Excited</mat-option>
      <mat-option value="stressed">Stressed</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Visibility</mat-label>
    <mat-select>
      <mat-option value="private">Private</mat-option>
      <mat-option value="public">Public</mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-raised-button color="primary">Save Entry</button>
</mat-card>
