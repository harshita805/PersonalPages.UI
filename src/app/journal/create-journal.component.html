<div class="journal-container">

  <h2>Create Journal Entry</h2>

  <input type="text" placeholder="Title" [(ngModel)]="title" class="title-input" />

  <textarea rows="8" placeholder="Write your thoughts..." [value]="content" (input)="onContentChange($event)">
  </textarea>

  <!-- Mood Section -->
  <div class="mood-section">
    @if(isMoodLoading){
    <div>🧠 Detecting mood...</div>
    }
    @else{
    <div>
      <strong>Mood:</strong>
      <span class="mood-badge">{{ detectedMood }}</span>
      @if(moodConfidence > 0){
      <span>
        ({{ moodConfidence | number:'1.0-0' }}%)
      </span>
      }
    </div>
    }
  </div>

  <!-- AI Suggestion -->
  @if(isSuggestionLoading){
  <div class="ai-loading">
    🤖 Thinking...
  </div>
  }

  @if(suggestion && !isSuggestionLoading){
  <!-- AI Suggestion -->
  <div class="ai-suggestion" (click)="appendSuggestion()">

    💡 <strong>Click to add:</strong>

    <p>{{ suggestion }}</p>

  </div>

  }

  <button (click)="saveJournal()" [disabled]="isSaving">
    {{ isSaving ? 'Saving...' : 'Save Journal' }}
  </button>

</div>
