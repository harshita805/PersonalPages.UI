<div class="page-container">
  <mat-card class="form-card">
    <h2>Write Journal</h2>

    <form [formGroup]="journalForm" (ngSubmit)="save()">

      <mat-form-field class="full" appearance="outline">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title">
      </mat-form-field>

      <mat-form-field class="full" appearance="outline">
        <mat-label>Content</mat-label>
        <textarea matInput rows="6" formControlName="content"></textarea>
      </mat-form-field>

      <mat-form-field class="full" appearance="outline">
        <mat-label>Mood</mat-label>
        <mat-select formControlName="mood">
          <mat-option value="Happy">Happy</mat-option>
          <mat-option value="Sad">Sad</mat-option>
          <mat-option value="Neutral">Neutral</mat-option>
          <mat-option value="Excited">Excited</mat-option>
          <mat-option value="Stressed">Stressed</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-checkbox formControlName="isPublic">
        Make Public
      </mat-checkbox>

      <br><br>

      <button mat-raised-button color="primary" class="full">
        Save Journal
      </button>

    </form>
  </mat-card>
</div>
